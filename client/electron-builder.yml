appId: com.agentcalendar.app
productName: Agent-Calendar
copyright: Copyright © 2026

# Don't auto-publish from builder; release upload is handled by GH Actions
publish: null

directories:
  output: release
  buildResources: build

files:
  - dist/**/*
  - dist-electron/**/*
  - package.json

# Mac: dmg for both architectures; unsigned (personal use)
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [arm64, x64]
  identity: null              # disable code signing (no Apple Developer ID)
  hardenedRuntime: false
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-mac-${arch}.${ext}

# Windows: nsis installer for x64; unsigned
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win-${arch}-setup.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Agent-Calendar

# DMG layout (Mac drag-to-Applications)
dmg:
  title: ${productName} ${version}
