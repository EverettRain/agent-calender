[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-calendar-server"
version = "0.1.0"
description = "Agent-Calendar FastAPI server — single-user, LLM-driven reminder extraction"
requires-python = ">=3.11,<3.14"
readme = "README.md"

dependencies = [
    # Web framework
    "fastapi>=0.115,<0.116",
    "uvicorn[standard]>=0.32,<0.33",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",

    # DB
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.20,<0.21",
    "alembic>=1.13,<2",

    # Scheduling
    "apscheduler>=3.10,<4",

    # LLM (DeepSeek 走 OpenAI 兼容协议)
    "openai>=1.54,<2",

    # Structured logging
    "structlog>=24.4,<25",

    # SSE
    "sse-starlette>=2.1,<3",

    # Telegram bot (optional — disabled when TELEGRAM_BOT_TOKEN is empty)
    "python-telegram-bot>=22.0,<23",
]

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<0.25",
    "pytest-cov>=5.0,<6",
    "httpx>=0.27,<0.28",          # for TestClient
    "ruff>=0.7,<0.8",
    "mypy>=1.13,<2",
]

[tool.setuptools]
packages = ["app"]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() idiom requires call-in-default
    "RUF001", # Chinese punctuation in prompts/comments is intentional
    "RUF002", # same, in docstrings
    "RUF003", # same, in comments
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

# Standalone pip-installable spec (mirrors dependencies above for convenience).
# Production install should use `uv sync` instead.
