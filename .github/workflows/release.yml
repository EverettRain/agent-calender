name: Release Desktop Client

on:
  push:
    tags:
      - "v*.*.*"          # e.g. v0.5.0
  workflow_dispatch:       # also allow manual trigger from Actions tab

permissions:
  contents: write          # needed to create / update GitHub Releases

jobs:
  build:
    name: Build ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Build (renderer + main + electron-builder)
        working-directory: client
        env:
          # Skip auto-publish; we upload via the next step
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: pnpm build

      - name: List release artifacts
        working-directory: client/release
        shell: bash
        run: ls -lah

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            client/release/*.dmg
            client/release/*.exe
            client/release/*.dmg.blockmap
            client/release/*.exe.blockmap
            client/release/latest*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
